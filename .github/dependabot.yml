version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases age before proposing them; security updates ignore this.
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      dev-tooling:
        patterns: ['*']
        exclude-patterns: ['astro', '@astrojs/*']
    ignore:
      # @astrojs/check only accepts TypeScript 5 and 6 (peer dependency), so a
      # TypeScript 7 lockfile makes `npm ci` fail with ERESOLVE. Remove this
      # once an @astrojs/check release supports TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci(deps)'
