# Deploys the static "down for maintenance" holding page in maintenance/ to
# GitHub Pages.
#
# GitHub Pages serves whichever deployment happened most recently, so running
# this workflow replaces the Hugo site with the holding page. To put the Hugo
# site back, run "Platform release to Pages" by hand from the Actions tab.
name: Maintenance page to Pages

on:
  # Deploys automatically when the holding page (or this workflow) changes on main
  push:
    branches: [main]
    paths:
      - 'maintenance/**'
      - '.github/workflows/maintenance-pages.yml'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

# Same group as the site workflows so two deploys never race
concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Serve the holding page for unknown paths too
        run: cp maintenance/index.html maintenance/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./maintenance
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Clean up old deployments
        uses: actions/github-script@v7
        with:
          script: |
            const deployments = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: 'github-pages',
              per_page: 100
            });
            const stale = deployments.data.slice(1);
            for (const d of stale) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: d.id,
                state: 'inactive'
              });
              await github.rest.repos.deleteDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: d.id
              });
            }
            console.log(`Cleaned up ${stale.length} old deployments`);
