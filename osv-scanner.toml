ignoreUntil = 2026-12-18
reason = "No fixed picomatch release exists yet (fix PRs are open upstream). The ReDoS needs an attacker-supplied glob pattern; here picomatch is a build-time dev dependency of Astro/Vite that only sees globs from this repo, and the deployed site is static HTML."
