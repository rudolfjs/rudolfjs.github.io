# Advisories accepted for now, each with an expiry and a reason.
#
# Read by OSV-Scanner (it applies the osv-scanner.toml next to the lockfile it
# scans) and by scripts/npm-audit.ts, so `npm audit`, the pre-push hook and
# both workflows honour the same list. An entry stops applying on its
# ignoreUntil date (UTC) and the scans fail again: upgrade then, or renew it
# deliberately. tests/npm-audit.test.ts requires every entry to carry
# ignoreUntil and reason.

[[IgnoredVulns]]
